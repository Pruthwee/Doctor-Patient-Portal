apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doctor-patient-portal-ingress
  namespace: doctor-patient-portal
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  rules:
  - host: doctor-patient-portal.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: doctor-patient-portal-service
            port:
              number: 80
