apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-patient-portal
  namespace: "{{NAMESPACE}}"
  labels:
    app: doctor-patient-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-patient-portal
  template:
    metadata:
      labels:
        app: doctor-patient-portal
    spec:
      containers:
        - name: doctor-patient-portal
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_PORT
              value: "{{DB_PORT}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: doctor-patient-portal-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: doctor-patient-portal-secrets
                  key: db-password
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: doctor-patient-portal-secrets
                  key: redis-password
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: TZ
              value: "UTC"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
