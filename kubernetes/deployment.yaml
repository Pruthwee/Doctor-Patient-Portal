apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-patient-portal
  namespace: doctor-patient-portal
  labels:
    app: doctor-patient-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-patient-portal
  template:
    metadata:
      labels:
        app: doctor-patient-portal
    spec:
      containers:
      - name: doctor-patient-portal
        image: "{{IMAGE_URI}}"
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          value: "{{DB_URL}}"
        - name: DB_USER
          value: "{{DB_USER}}"
        - name: DB_PASS
          value: "{{DB_PASS}}"
        - name: REDIS_HOST
          value: "{{REDIS_HOST}}"
        - name: REDIS_PORT
          value: "{{REDIS_PORT}}"
        - name: REDIS_PASSWORD
          value: "{{REDIS_PASSWORD}}"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
