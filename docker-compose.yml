version: '3'
services:
  doctor-patient-portal:
    image: doctor-patient-portal:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST:?set DB_HOST}
      - DB_PORT=${DB_PORT:?set DB_PORT}
      - DB_NAME=${DB_NAME:?set DB_NAME}
      - DB_USER=${DB_USER:?set DB_USER}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:?set REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:?set REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - ./src/main/webapp:/opt/tomcat/webapps/ROOT
