services:
  doctor-patient-portal:
    image: doctor-patient-portal:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctor-patient-portal
    ports:
      - "8080:8080"
    environment:
      # Redis (Amazon ElastiCache) that stores the HttpSession; reached through the environment of the shell that runs compose
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_SSL: ${REDIS_SSL:-false}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC}
      TZ: UTC
    volumes:
      - tomcat-logs:/opt/tomcat/logs
    restart: unless-stopped

volumes:
  tomcat-logs:
