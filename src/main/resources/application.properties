# Safe logging: prevent SDK wire/request logs and secret values from being logged
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.com.zaxxer.hikari=INFO

# Database connection configuration (cr-java-0073, cr-java-0097)
# DB_HOST, DB_PORT, DB_NAME, DB_USER are read from the environment
# DB_SECRET_NAME is the AWS Secrets Manager secret holding username and password
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.data-source-properties.connectTimeout=5000
spring.datasource.hikari.data-source-properties.socketTimeout=30000
spring.datasource.hikari.data-source-properties.loginTimeout=10
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# AWS Secrets Manager secret name for database credentials (cr-java-0113)
DB_SECRET_NAME=${DB_SECRET_NAME:prod/myapp/database}

# Redis/ElastiCache configuration for Spring Session (cr-java-0065)
spring.session.store-type=redis
spring.session.timeout=1800s
spring.session.redis.namespace=spring:session
spring.session.redis.flush-mode=on_save
spring.redis.host=${ELASTICACHE_ENDPOINT:localhost}
spring.redis.port=${ELASTICACHE_PORT:6379}
spring.redis.ssl.enabled=true
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5
