# Safe logging: prevent SDK wire/request logs from leaking secrets (cloud-services skill)
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
logging.level.com.zaxxer.hikari=INFO

# Spring Session Redis configuration (cr-java-0065: HTTP Session State Storage)
spring.session.store-type=redis
spring.session.timeout=1800s
spring.session.redis.namespace=spring:session
spring.session.redis.flush-mode=on_save

# Redis / ElastiCache connection (cr-java-0065: HTTP Session State Storage)
spring.redis.host=${ELASTICACHE_ENDPOINT:localhost}
spring.redis.port=${ELASTICACHE_PORT:6379}
spring.redis.ssl.enabled=${ELASTICACHE_SSL_ENABLED:true}
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5

# Embedded Tomcat (cr-java-0107: Convert WAR to executable JAR)
server.port=${PORT:8080}
server.tomcat.max-connections=8192
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10

# Database configuration (cr-java-0073: Direct JDBC Connections)
# RDS Proxy endpoint replaces direct RDS connection
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.data-source-properties.connectTimeout=5000
spring.datasource.hikari.data-source-properties.socketTimeout=30000
spring.datasource.hikari.data-source-properties.loginTimeout=10000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
