# =============================================================================
# Cloud-Ready Database Configuration (HikariCP + Amazon RDS Proxy)
# =============================================================================
#
# These properties provide default values for the HikariCP connection pool.
# In a cloud (AWS) deployment, override these via environment variables or
# AWS Systems Manager Parameter Store / Secrets Manager.
#
# When using Amazon RDS Proxy, set DB_JDBC_URL to the RDS Proxy endpoint:
#   DB_JDBC_URL=jdbc:mysql://<proxy-endpoint>.proxy-<region>.rds.amazonaws.com:3306/hospital
#
# Database connection details
DB_DRIVER_CLASS=com.mysql.cj.jdbc.Driver
DB_JDBC_URL=jdbc:mysql://localhost:3306/hospital
DB_USERNAME=root
DB_PASSWORD=

# HikariCP pool configuration
DB_POOL_NAME=HikariCP
DB_POOL_SIZE=10
DB_MIN_IDLE=2
DB_CONNECTION_TIMEOUT_MS=30000
DB_IDLE_TIMEOUT_MS=600000
DB_MAX_LIFETIME_MS=1800000
DB_SOCKET_TIMEOUT_MS=30000
DB_LEAK_DETECTION_THRESHOLD_MS=60000
